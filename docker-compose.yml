services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse_link
      BASE_URL: http://localhost:3000
      PORT: 3000
      APP_MODE: all
      TRUST_PROXY: 'false'
      CLICK_FLUSH_MS: 1000
      NODE_ENV: production
    ports:
      - '3000:3000'
    # Migrations run in the image's CMD before the server starts; on SIGTERM the server drains
    # the click buffer (gives up after 5 s), well inside this grace period.
    stop_grace_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse_link
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulse -d pulse_link']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
